<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BDXbet Admin Login</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#030712;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:390px;
    background:#0b1220;
    border:1px solid #263247;
    border-radius:20px;
    padding:28px;
    box-shadow:0 20px 60px #0008;
}

.logo{
    font-size:28px;
    font-weight:800;
    text-align:center;
    color:#f5a623;
}

.sub{
    text-align:center;
    color:#94a3b8;
    margin:7px 0 28px;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#cbd5e1;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #334155;
    background:#111827;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#f5a623;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#f5a623;
    color:#111;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#error{
    display:none;
    background:#451a1a;
    color:#fecaca;
    border:1px solid #7f1d1d;
    padding:11px;
    border-radius:10px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        BDXbet ADMIN
    </div>

    <div class="sub">
        Secure administration panel
    </div>

    <form id="form">

        <label>Username</label>

        <input
            id="username"
            type="text"
            autocomplete="username"
            required
        >

        <label>Password</label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button id="btn" type="submit">
            LOGIN
        </button>

        <div id="error"></div>

    </form>

</div>

<script>

const form = document.getElementById("form");
const btn = document.getElementById("btn");
const error = document.getElementById("error");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    error.style.display = "none";
    btn.disabled = true;
    btn.textContent = "LOGIN...";

    try{

        const response = await fetch("/api/admin/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                username:
                    document.getElementById("username").value.trim(),

                password:
                    document.getElementById("password").value

            })

        });

        const data = await response.json();

        if(!response.ok || !data.ok){

            throw new Error(
                data.error || "Login failed"
            );

        }

        localStorage.setItem(
            "bdxbet_admin_token",
            data.token
        );

        window.location.href =
            "/admin/dashboard.html";

    }catch(errorMessage){

        error.textContent =
            errorMessage.message;

        error.style.display = "block";

    }finally{

        btn.disabled = false;
        btn.textContent = "LOGIN";

    }

});

</script>

</body>
</html>
