<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDXbet Ludo Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050914;color:#fff;font-family:Arial,sans-serif}
.box{width:min(92vw,390px);padding:28px;border:1px solid #c99a25;border-radius:20px;background:linear-gradient(160deg,#12264b,#060b16);box-shadow:0 20px 60px #000}
h1{margin:0 0 8px;color:#ffd83d;font-size:24px}.sub{color:#91add5;font-size:12px;margin-bottom:22px}
input,button{width:100%;padding:13px;border-radius:11px;margin-top:10px;font-size:15px}input{background:#081225;color:#fff;border:1px solid #29436f}button{border:0;background:#ffd23a;font-weight:900;cursor:pointer}.err{color:#ff8b8b;font-size:12px;margin-top:12px;min-height:18px}
</style></head><body><div class="box">
<h1>🎮 BDXbet Ludo Admin</h1><div class="sub">Secure Ludo control panel</div>
<input id="u" placeholder="Admin username" autocomplete="username">
<input id="p" type="password" placeholder="Admin password" autocomplete="current-password">
<button onclick="login()">LOGIN</button><div id="e" class="err"></div>
</div>
<script>
async function login(){
 const e=document.getElementById('e');e.textContent='';
 try{
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});
  const d=await r.json(); if(!r.ok) throw Error(d.error||'Login failed');
  localStorage.setItem('bdxbet_ludo_admin_token',d.token);location.href='/admin/dashboard.html';
 }catch(x){e.textContent=x.message}
}
</script></body></html>
